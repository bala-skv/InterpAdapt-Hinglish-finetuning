[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "interp-adapt-hinglish"
version = "0.1.0"
description = "Interpretability-guided circuit routing for Hindi-English LoRA fine-tuning"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "transformers>=4.44,<5",
    "accelerate>=0.33",
    "peft>=0.12",
    "bitsandbytes>=0.43",
    "pyyaml>=6.0",
    "datasets>=2.14",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["circuit_routing*", "interp_adapt*"]
