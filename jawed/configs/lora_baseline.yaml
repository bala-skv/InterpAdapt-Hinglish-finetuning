# ---------------------------------------------------------------------------
# Stage-2 uniform-LoRA fine-tuning baseline -- the "one real number".
# Consumed by scripts/train_lora_baseline.py (its own dataclasses; NOT the
# Phase-0 config loader). Reports base-vs-LoRA sentiment accuracy / macro-F1 on
# Satyam's frozen SAIL-2017 Romanized (Hinglish) code-mixed validation split.
# ---------------------------------------------------------------------------

output_dir: "runs"

model:
  # Same pinned base checkpoint as Stage 1, so scores stay comparable.
  name: "Qwen/Qwen2.5-1.5B"
  revision: "8faed761d45a263340a0528343f099c05c9a4323"
  dtype: "float16"          # fp16: Turing (sm_75 / 2080 Ti) has no native bf16
  trust_remote_code: false
  forbid_instruct: true
  expect_num_layers: 28
  expect_num_attention_heads: 12
  expect_num_key_value_heads: 2

quant:
  # Unused at fp16 (quant_mode="none"), kept so load_model's signature is happy.
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_use_double_quant: true

lora:
  rank: 8
  alpha: 16
  dropout: 0.05             # small dropout: the SAIL train split is tiny (~10k)
  # Head-aligned projections (blocks of head_dim). k/v are KV-group aligned, so
  # the future per-head routing mask can only live on q_proj/o_proj -- the
  # uniform baseline shares that surface for an apples-to-apples comparison.
  target_modules: ["q_proj", "o_proj"]

data:
  # Local task file takes precedence -- point jsonl_train at a refreshed split
  # ({"text","label"} per line) if one lands and nothing else changes.
  jsonl_train: null
  jsonl_eval: null
  # Satyam's frozen, de-duplicated SAIL-2017 Romanized Stage-2 splits.
  # Each row is a "<post>\t<label>" text line; labels: negative/neutral/positive.
  hf_dataset: "satyam-arora-iiit-hyderabad/babyshark-sail2017-stage2"
  hf_config: null
  hf_train_split: "train"        # 10,068 examples (sanitized)
  hf_eval_split: "validation"    # 1,260 examples (sanitized)
  # IMPORTANT: load the sanitized files explicitly. The repo also ships raw/
  # files and the auto-merged default config mixes both (~2x rows) AND undoes the
  # 12-example train->eval de-duplication. Point at sanitized/ to avoid leakage.
  hf_train_file: "sanitized/train.txt"
  hf_eval_file: "sanitized/validation.txt"
  train_size: null          # null = full frozen train split
  eval_size: null           # null = full frozen validation split
  max_len: 256

train:
  seed: 0
  deterministic: true
  batch_size: 4
  grad_accum_steps: 8       # effective batch 32
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 30
  max_steps: 600            # ~2 epochs over 10k examples at eff-batch 32
  ckpt_every: 100           # resumable checkpoints to the durable run dir
  eval_every: 200           # periodic base-vs-LoRA accuracy checks
  max_grad_norm: 1.0

wandb:
  # Experiment tracking -> the W&B link required by submission guidelines §3.
  # On the cluster, `export WANDB_API_KEY=...` (or `wandb login`) once; the GPU
  # node has internet. Set enabled: false or mode: offline for no-network runs
  # (offline writes a local run you can `wandb sync` later). Resumable: a chained
  # SLURM job continues the SAME run via run_dir/wandb_run_id.
  enabled: true
  project: "babyshark-cra"
  entity: null              # your W&B team/username; null uses the logged-in default
  run_name: null            # null -> the run-dir name (lora-baseline-<timestamp>)
  mode: "online"            # online | offline | disabled
  tags: ["stage2", "lora-baseline", "sail2017"]

