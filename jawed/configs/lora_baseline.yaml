# ---------------------------------------------------------------------------
# Stage-2 uniform-LoRA fine-tuning baseline -- the "one real number".
# Consumed by scripts/train_lora_baseline.py (its own dataclasses; NOT the
# Phase-0 config loader). Reports base-vs-LoRA mean target log-prob on a
# held-out English->Hindi eval split.
# ---------------------------------------------------------------------------

output_dir: "runs"

model:
  # Same pinned base checkpoint as Stage 1, so scores stay comparable.
  name: "Qwen/Qwen2.5-1.5B"
  revision: "8faed761d45a263340a0528343f099c05c9a4323"
  dtype: "float16"          # fp16: Turing (sm_75 / 2080 Ti) has no native bf16
  trust_remote_code: false
  forbid_instruct: true
  expect_num_layers: 28
  expect_num_attention_heads: 12
  expect_num_key_value_heads: 2

quant:
  # Unused at fp16 (quant_mode="none"), kept so load_model's signature is happy.
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_use_double_quant: true

lora:
  rank: 8
  alpha: 16
  dropout: 0.0
  # Head-aligned projections (blocks of head_dim). k/v are KV-group aligned, so
  # the future per-head routing mask can only live on q_proj/o_proj -- the
  # uniform baseline shares that surface for an apples-to-apples comparison.
  target_modules: ["q_proj", "o_proj"]

data:
  # Local task file takes precedence -- point jsonl_train at Satyam's split
  # ({"en","hi"} per line) when it lands and nothing else changes.
  jsonl_train: null
  jsonl_eval: null
  # Fallback parallel corpus (IIT-B English-Hindi) for a self-contained number.
  hf_dataset: "cfilt/iitb-english-hindi"
  hf_config: null
  hf_train_split: "train"
  hf_eval_split: "validation"
  train_size: 4000          # small on purpose: one defensible number, fast
  eval_size: 200
  max_len: 256

train:
  seed: 0
  deterministic: true
  batch_size: 4
  grad_accum_steps: 8       # effective batch 32
  lr: 2.0e-4
  weight_decay: 0.0
  warmup_steps: 20
  max_steps: 400
  ckpt_every: 50            # resumable checkpoints to the durable run dir
  eval_every: 0            # 0 = eval only at the end
  max_grad_norm: 1.0
