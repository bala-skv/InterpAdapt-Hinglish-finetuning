# ---------------------------------------------------------------------------
# Stage-2 CRA -- PRELIMINARY cloud run (Colab / Kaggle single T4 or P100).
#
# Identical model / task / budget / masks to configs/cra_compare.yaml so the
# arm comparison is still apples-to-apples. The ONLY differences are run-loop
# knobs tuned for a short-lived cloud session:
#   * eval_every == max_steps  -> skip mid-training evals, run ONE final eval
#     (the per-arm number we report), saving GPU minutes.
#   * ckpt_every == max_steps  -> one checkpoint at the end (no resume needed;
#     cloud sessions don't self-chain like SLURM).
#   * wandb.enabled: false     -> keep the *preliminary, non-ADA* numbers OUT of
#     the official W&B project by default. Flip to true (and `wandb login`) only
#     if the team wants them logged, clearly tagged as preliminary.
#
# IMPORTANT (frozen rule): numbers produced here are NON-ADA and PRELIMINARY.
# They are an internal sanity check of the four-arm ordering ONLY and must NOT
# be placed in the official results table. The official table stays "pending"
# until the arms are rerun on ADA.
#
# Run all four arms with:  bash cluster/run_cloud_gpu.sh
# ---------------------------------------------------------------------------

output_dir: "runs"

model:
  name: "Qwen/Qwen2.5-1.5B"
  revision: "8faed761d45a263340a0528343f099c05c9a4323"
  dtype: "float16"
  trust_remote_code: false
  forbid_instruct: true
  expect_num_layers: 28
  expect_num_attention_heads: 12
  expect_num_key_value_heads: 2

quant:
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_use_double_quant: true

cra:
  # uniform | soft | topk | random. Override per run with --mask-mode.
  mask_mode: "soft"
  # PRIMARY scope (same as ADA config): one scale/threshold across all 336 heads.
  scope: "global"
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules: ["q_proj", "o_proj"]
  scores_file: "data/stage1_head_scores.json"
  k: 4
  k_total: 112
  soft_floor: 0.0
  soft_normalize: true
  random_seed: 0

data:
  jsonl_train: null
  jsonl_eval: null
  hf_dataset: "satyam-arora-iiit-hyderabad/babyshark-sail2017-stage2"
  hf_config: null
  hf_train_split: "train"
  hf_eval_split: "validation"
  hf_train_file: "sanitized/train.txt"
  hf_eval_file: "sanitized/validation.txt"
  # Full validation (n=1260) for a genuine preliminary number. To go faster on a
  # short session, set eval_size (e.g. 400) here or via EVAL_SIZE in the runner.
  train_size: null
  eval_size: null
  max_len: 256

train:
  seed: 0
  deterministic: true
  batch_size: 4
  grad_accum_steps: 8       # effective batch 32 -- same as ADA
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 30
  max_steps: 600            # same budget as the baseline / ADA config
  ckpt_every: 600           # one checkpoint at the end (no self-chaining here)
  eval_every: 600           # only the final eval -> saves cloud GPU minutes
  max_grad_norm: 1.0

wandb:
  enabled: false            # preliminary non-ADA run: off by default (see header)
  project: "babyshark-cra"
  entity: "phdiiitmohammed-iiit-hyderabad"
  run_name: null
  mode: "online"
  tags: ["stage2", "cra", "sail2017", "preliminary", "non-ada"]
