# ---------------------------------------------------------------------------
# Stage-2 Circuit-Routing Adapter vs. matched-budget controls.
# Consumed by scripts/train_cra_compare.py. Run ONE arm per invocation
# (cra.mask_mode or --mask-mode); compare the RESULT lines / W&B across arms:
#   uniform  -> reproduces the LoRA baseline (sanity)
#   soft     -> soft scaling M = f(s_i) from Stage-1 scores (the CRA)
#   topk     -> hard top-k heads per layer
#   random   -> k random heads per layer at the SAME budget as topk (control)
# Same SAIL-2017 Romanized (Hinglish) sentiment task + metric as the baseline.
# ---------------------------------------------------------------------------

output_dir: "runs"

model:
  name: "Qwen/Qwen2.5-1.5B"
  revision: "8faed761d45a263340a0528343f099c05c9a4323"
  dtype: "float16"
  trust_remote_code: false
  forbid_instruct: true
  expect_num_layers: 28
  expect_num_attention_heads: 12
  expect_num_key_value_heads: 2

quant:
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_use_double_quant: true

cra:
  # uniform | soft | topk | random. Override per run with --mask-mode.
  mask_mode: "soft"
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules: ["q_proj", "o_proj"]
  # Daniel's Stage-1 per-(layer, query-head) causal scores:
  #   {"scores": [[<head0>, ...], ...]}   shape [28][12]
  # REQUIRED for soft/topk/random; leave null only for mask_mode=uniform.
  scores_file: "data/stage1_head_scores.json"
  # topk / random: heads kept PER LAYER (matched budget across the two).
  k: 4
  # soft: f(s_i) = min-max to [soft_floor, 1] (monotone). normalize=false -> raw s_i.
  soft_floor: 0.0
  soft_normalize: true
  # random: seed for the matched-budget random head set (reported in results).
  random_seed: 0

data:
  jsonl_train: null
  jsonl_eval: null
  hf_dataset: "satyam-arora-iiit-hyderabad/babyshark-sail2017-stage2"
  hf_config: null
  hf_train_split: "train"
  hf_eval_split: "validation"
  hf_train_file: "sanitized/train.txt"
  hf_eval_file: "sanitized/validation.txt"
  train_size: null
  eval_size: null
  max_len: 256

train:
  seed: 0
  deterministic: true
  batch_size: 4
  grad_accum_steps: 8       # effective batch 32
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 30
  max_steps: 600            # match the baseline's budget for a fair comparison
  ckpt_every: 100
  eval_every: 200
  max_grad_norm: 1.0

wandb:
  enabled: true
  project: "babyshark-cra"
  entity: "phdiiitmohammed-iiit-hyderabad"
  run_name: null            # null -> the run-dir name (cra-<mode>-<timestamp>)
  mode: "online"
  tags: ["stage2", "cra", "sail2017"]
