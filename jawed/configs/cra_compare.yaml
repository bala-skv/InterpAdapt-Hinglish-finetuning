# ---------------------------------------------------------------------------
# Stage-2 Circuit-Routing Adapter vs. matched-budget controls.
# Consumed by scripts/train_cra_compare.py. Run ONE arm per invocation
# (cra.mask_mode or --mask-mode); compare the RESULT lines / W&B across arms:
#   uniform  -> reproduces the LoRA baseline (sanity)
#   soft     -> soft scaling M = clip(s,0)/global_max from Stage-1 v2 scores (CRA)
#   topk     -> hard top-k heads over ALL 336 heads (global scope)
#   random   -> k_total random heads at the SAME budget as topk (control)
# PRIMARY scope is GLOBAL: one scale/threshold across all L*H=336 heads, so a
# noisy layer's best head is not forced to a full gate. scope=per_layer is the
# ablation control. Same SAIL-2017 Romanized (Hinglish) sentiment task + metric
# (validation macro-F1) as the baseline.
# ---------------------------------------------------------------------------

output_dir: "runs"

model:
  name: "Qwen/Qwen2.5-1.5B"
  revision: "8faed761d45a263340a0528343f099c05c9a4323"
  dtype: "float16"
  trust_remote_code: false
  forbid_instruct: true
  expect_num_layers: 28
  expect_num_attention_heads: 12
  expect_num_key_value_heads: 2

quant:
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_use_double_quant: true

cra:
  # uniform | soft | topk | random. Override per run with --mask-mode.
  mask_mode: "soft"
  # PRIMARY scope. global -> one scale/threshold across all 336 heads;
  # per_layer -> the ablation control (per-layer min-max soft / per-layer top-k).
  scope: "global"
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules: ["q_proj", "o_proj"]
  # Daniel's Stage-1 v2 per-(layer, query-head) causal scores (regenerated from
  # interp/runs/full_trace_v2.json -> summary.en_hi-latn.heatmap_mean):
  #   {"scores": [[<head0>, ...], ...]}   shape [28][12]
  # REQUIRED for soft/topk/random; leave null only for mask_mode=uniform.
  scores_file: "data/stage1_head_scores.json"
  # per_layer topk/random: heads kept PER LAYER (matched budget across the two).
  k: 4
  # global topk/random: heads kept across ALL 336 heads (matched budget).
  k_total: 112
  # soft: per_layer f(s_i)=min-max to [soft_floor,1]; global f(s_i)=clip(s,0)/global_max.
  soft_floor: 0.0
  soft_normalize: true
  # random: seed for the matched-budget random head set (reported in results).
  random_seed: 0

data:
  jsonl_train: null
  jsonl_eval: null
  hf_dataset: "satyam-arora-iiit-hyderabad/babyshark-sail2017-stage2"
  hf_config: null
  hf_train_split: "train"
  hf_eval_split: "validation"
  hf_train_file: "sanitized/train.txt"
  hf_eval_file: "sanitized/validation.txt"
  train_size: null
  eval_size: null
  max_len: 256

train:
  seed: 0
  deterministic: true
  batch_size: 4
  grad_accum_steps: 8       # effective batch 32
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 30
  max_steps: 600            # match the baseline's budget for a fair comparison
  ckpt_every: 100
  eval_every: 200
  max_grad_norm: 1.0

wandb:
  enabled: true
  project: "babyshark-cra"
  entity: "phdiiitmohammed-iiit-hyderabad"
  run_name: null            # null -> the run-dir name (cra-<mode>-<timestamp>)
  mode: "online"
  tags: ["stage2", "cra", "sail2017"]
